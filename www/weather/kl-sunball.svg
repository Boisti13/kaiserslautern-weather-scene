<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs><radialGradient id="g"><stop offset="0" stop-color="#fff4c2" stop-opacity=".8"/>
  <stop offset=".35" stop-color="#ffe28a" stop-opacity=".35"/><stop offset="1" stop-color="#ffe28a" stop-opacity="0"/></radialGradient></defs>
  <style>
    .glow{transform-origin:60px 60px;animation:pulse 6s ease-in-out infinite}
    .rays{transform-origin:60px 60px;animation:spin 90s linear infinite}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.1);opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <circle class="glow" cx="60" cy="60" r="58" fill="url(#g)"/>
  <g class="rays" fill="#fff2b0" fill-opacity=".7"><rect x="58.75" y="29" width="2.5" height="8.5" rx="1.25" transform="rotate(0 60 60)"/><rect x="58.75" y="29" width="2.5" height="8.5" rx="1.25" transform="rotate(30 60 60)"/><rect x="58.75" y="29" width="2.5" height="8.5" rx="1.25" transform="rotate(60 60 60)"/><rect x="58.75" y="29" width="2.5" height="8.5" rx="1.25" transform="rotate(90 60 60)"/><rect x="58.75" y="29" width="2.5" height="8.5" rx="1.25" transform="rotate(120 60 60)"/><rect x="58.75" y="29" width="2.5" height="8.5" rx="1.25" transform="rotate(150 60 60)"/><rect x="58.75" y="29" width="2.5" height="8.5" rx="1.25" transform="rotate(180 60 60)"/><rect x="58.75" y="29" width="2.5" height="8.5" rx="1.25" transform="rotate(210 60 60)"/><rect x="58.75" y="29" width="2.5" height="8.5" rx="1.25" transform="rotate(240 60 60)"/><rect x="58.75" y="29" width="2.5" height="8.5" rx="1.25" transform="rotate(270 60 60)"/><rect x="58.75" y="29" width="2.5" height="8.5" rx="1.25" transform="rotate(300 60 60)"/><rect x="58.75" y="29" width="2.5" height="8.5" rx="1.25" transform="rotate(330 60 60)"/></g>
  <circle cx="60" cy="60" r="13" fill="#fff4c2"/>
  <circle cx="60" cy="60" r="10.8" fill="#ffe27a"/>
</svg>
