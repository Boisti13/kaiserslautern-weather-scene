# Kaiserslautern weather scene: generated by scripts/card.py from card/card.template.json
# and card/layers.js; paste into a dashboard (Edit card > Show code editor).
type: custom:vertical-stack-in-card
grid_options:
  columns: 12
cards:
- type: custom:bubble-card
  card_type: button
  button_type: state
  entity: sensor.virtual_outdoor_temperature
  card_layout: large
  force_icon: true
  name: '{% set s = states(''weather.forecast_home'') %}{% if s not in [''unavailable'', ''unknown''] %}{{ s.replace(''partlycloudy'', ''partly cloudy'').replace(''-'', '' '') | capitalize }}{% else %}{{
    {''clear'': ''Clear'', ''partly'': ''Partly cloudy'', ''cloudy'': ''Cloudy'', ''fog'': ''Fog'', ''rain'': ''Rainy'', ''pour'': ''Pouring'', ''hail'': ''Hail'', ''sleet'': ''Snowy rainy'', ''snow'':
    ''Snowy'', ''lightning'': ''Lightning'', ''storm'': ''Lightning rainy''}.get(state_attr(''sensor.overview_sky'', ''weather''), '''') }}{% endif %}'
  icon: '{% set s = states(''weather.forecast_home'') %}{{ ''mdi:weather-'' ~ {''partlycloudy'': ''partly-cloudy'', ''clear-night'': ''night'', ''exceptional'': ''cloudy-alert''}.get(s, s) if s not in [''unavailable'',
    ''unknown''] else ''mdi:weather-cloudy-alert'' }}'
  tap_action:
    action: navigate
    navigation_path: '#outside'
  button_action:
    tap_action:
      action: navigate
      navigation_path: '#outside'
  sub_button:
    bottom:
    - group:
      - entity: sensor.virtual_outdoor_humidity
        icon: mdi:water-percent
        state_content: state
        show_background: false
        fill_width: false
      - entity: sensor.virtual_outdoor_pressure
        show_state: true
        show_background: false
        fill_width: false
      - entity: sensor.virtual_outdoor_temperature_24h_min
        icon: mdi:arrow-down-thin
        show_state: true
        show_background: false
        fill_width: false
      - entity: sensor.virtual_outdoor_temperature_24h_max
        icon: mdi:arrow-up-thin
        show_state: true
        show_background: false
        fill_width: false
      buttons_layout: inline
      justify_content: start
  styles: |
    .bubble-button-card-container {
      --sky-night: linear-gradient(180deg, #0b1430, #1d2b55 70%, #3a4a78);
      --sky-night-grey: linear-gradient(180deg, #141a27, #262e40 70%, #3c4458);
      --sky-twilight: linear-gradient(180deg, #2b3a6b, #b0627a 65%, #f0a868);
      --sky-twilight-grey: linear-gradient(180deg, #3a4060, #7a6878 65%, #a88f88);
      --sky-clear: linear-gradient(180deg, #2f7fc8, #79b8e8 70%, #c4e2f6);
      --sky-partly: linear-gradient(180deg, #4f86b8, #97bad8 70%, #cfdde9);
      --sky-cloudy: linear-gradient(180deg, #66778a, #9eabb8 75%, #c1cad3);
      --sky-fog: linear-gradient(180deg, #8f99a3, #b9c0c7 70%, #d5dadf);
      --sky-rain: linear-gradient(180deg, #3f4c5a, #6f7d8b 75%, #8e9aa6);
      --sky-storm: linear-gradient(180deg, #23283a, #48506a 70%, #6a6f86);
      --sky-snow: linear-gradient(180deg, #8a9bb0, #c3cfdc 70%, #e8eef4);
      background: ${(() => {
      const s = hass.states['sensor.overview_sky'];
      const a = (s && s.attributes) || {};
      const t = a.time || 'day', w = a.weather || 'cloudy', dark = t !== 'day';
      const u = (f) => "url('/local/weather/" + f + "?v=15')";
      const cover = (f, pos) => u(f) + ' ' + (pos || 'center') + ' / cover no-repeat';
      const city = (f) => u(f) + ' center bottom / 100% auto no-repeat';
      const at = (f, x, y, sw, sh) => u(f) + ' calc(' + (x * 100).toFixed(1) + '% + ' + (sw * x - sw / 2).toFixed(1) + 'px) ' + (y * 184 - sh / 2).toFixed(1) + 'px / ' + sw + 'px ' + sh + 'px no-repeat';
      const d = a.drift || 0, dn = (d < 0 ? 'm' : 'p') + Math.abs(d);
      const clear = ['clear', 'partly'].includes(w);
      const L = ['linear-gradient(0deg, rgba(0, 0, 0, .5), rgba(0, 0, 0, .16) 22%, transparent 40%)'];
      const precip = {rain: 'rain', pour: 'pour', storm: 'pour', hail: 'hail', sleet: 'sleet', snow: 'snow'}[w];
      if (precip) L.push(u('kl-' + precip + '-' + dn + '.svg') + ' 0 0 / 180px 180px repeat');
      if (w === 'fog') L.push(cover('kl-fog-' + (dark ? 'night' : 'day') + '.svg', 'center bottom'));
      if (a.xmas) L.push(city('kl-xmas-' + (dark ? 'night' : 'day') + '.svg'));
      if (a.snow_cover) L.push(city('kl-snowcap-' + t + '.svg'));
      if (a.match) L.push(city('kl-match-' + (dark ? 'night' : 'day') + '.svg'));
      if (a.lights) L.push(city('kl-windows.svg'));
      const pal = dark ? t : a.snow_cover ? 'snow' : clear ? 'day' : 'grey';
      L.push(city('kl-skyline-' + pal + '-' + (a.season || 'summer') + '.svg'));
      if (['storm', 'lightning'].includes(w)) L.push(cover('kl-lightning.svg'));
      L.push(cover('kl-planes-' + t + '.svg'));
      const speed = a.windy ? 'windy' : 'calm', dir = d < 0 ? 'l' : 'r';
      if (w === 'partly') L.push(cover('kl-clouds-partly-' + t + '-' + speed + '-' + dir + '.svg'));
      else if (w !== 'clear') {
        const cp = dark ? t : ['storm', 'lightning'].includes(w) ? 'storm' : ['rain', 'pour', 'hail', 'sleet'].includes(w) ? 'dark' : 'light';
        L.push(cover('kl-clouds-overcast-' + cp + '-' + speed + '-' + dir + '.svg'));
      }
      if (clear) {
        if (typeof a.sun_elev === 'number' && a.sun_elev > -3) L.push(at(a.sun_elev < 6 ? 'kl-sunlow.svg' : 'kl-sunball.svg', a.sun_x, a.sun_y, 120, 120));
        if (dark && a.moon && a.moon_up) L.push(at('kl-moon-' + a.moon + '.svg', a.moon_x, a.moon_y, 90, 90));
        if (t === 'night') L.push(cover('kl-stars.svg'));
      }
      L.push('var(--sky-' + ((s && s.state) || 'cloudy') + ')');
      return L.join(', ');
    })()} !important;
      border-radius: var(--ha-card-border-radius, 12px) var(--ha-card-border-radius, 12px) 0 0 !important;
    }
    .bubble-name, .bubble-state, .bubble-sub-button { color: #fff !important; text-shadow: 0 1px 3px rgba(0, 0, 0, .55), 0 0 10px rgba(0, 0, 0, .25); }
    .bubble-content-container { margin-top: 22px !important; }
    .bubble-sub-button { font-size: 13px !important; }
    .bubble-sub-button-bottom-container { padding-inline-start: 6px !important; padding-bottom: 4px !important; }
    .bubble-name-container { line-height: normal !important; overflow: visible !important; gap: 4px; margin-inline: 14px 16px !important; }
    .bubble-name { font-size: 14px !important; font-weight: 600 !important; letter-spacing: .2px; opacity: .92; }
    .bubble-state { font-size: 30px !important; font-weight: 600 !important; line-height: 1.05 !important; opacity: 1 !important; }
    .bubble-icon-container { margin-inline-start: 14px !important; min-width: 48px !important; min-height: 48px !important; }
    .bubble-main-icon-container { background-color: rgba(255, 255, 255, .22) !important; }
    .bubble-main-icon { color: #fff !important; }
    .bubble-sub-button-1 .bubble-sub-button-icon { color: var(--cyan-color) !important; }
    .bubble-sub-button-2 .bubble-sub-button-icon { color: #cfd8dc !important; }
    .bubble-sub-button-3 .bubble-sub-button-icon { color: var(--light-blue-color) !important; }
    .bubble-sub-button-4 .bubble-sub-button-icon { color: var(--orange-color) !important; }
  grid_options:
    columns: 12
    rows: 3
- type: weather-forecast
  entity: weather.forecast_home
  show_current: false
  show_forecast: true
  forecast_type: daily
